  - generic [ref=f4e27]:
    - heading "Everyone asks how much they have. Almost nobody can answer how long they're covered." [level=2] [ref=f4e28]: Everyone asks how much they have.Almost nobody can answer how long they're covered.
    - paragraph [ref=f4e29]: A balance tells you about today. It doesn't tell you how many years your housing is financially covered. Global Reserve answers the second question — it reads everything you hold, everything you owe on housing, and turns it into time.
    - generic [ref=f4e30]:
      - paragraph [ref=f4e31]: Years of housing covered
      - paragraph [ref=f4e32]: 8.5 years
      - paragraph [ref=f4e33]: Your own number depends on what you hold and what you owe.
  - generic [ref=f4e37]:
    - generic [ref=f4e38]:
      - paragraph [ref=f4e39]: THE PART EVERYONE ASKS ABOUT FIRST
      - heading "RED isn't money. It's housing, paid forward." [level=2] [ref=f4e40]
    - paragraph [ref=f4e68]: "RED — Real Estate Dollars — are credits that exist for one purpose: covering your housing inside Glonari. Your monthly housing fee comes out of them, and they're what stands behind you when you move on a property. They're used, not traded — which is exactly why they hold their job instead of drifting off into something else."
    - generic [ref=f4e69]:
      - paragraph [ref=f4e70]: Made for housing, and nothing else
      - paragraph [ref=f4e71]: Spent as you live, not held as an investment
      - paragraph [ref=f4e72]: The more you hold, the longer you're covered
  - generic [ref=f4e74]:
    - heading "When the system saves you money, you keep it." [level=2] [ref=f4e75]
    - paragraph [ref=f4e76]: "Glonari is always looking for a better price, a better term, a smaller fee. When it finds one, the saving doesn't disappear into the platform — it comes back to you as rewards, and those rewards work on the same thing everything else here works on: your housing."
    - paragraph [ref=f4e77]: Nothing to claim. Nothing to chase. It happens whether you're watching or not.
