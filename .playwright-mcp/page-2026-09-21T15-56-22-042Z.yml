  - generic [ref=f6e27]:
    - heading "Everyone asks how much they have. Almost nobody can answer how long they're covered." [level=2] [ref=f6e28]: Everyone asks how much they have.Almost nobody can answer how long they're covered.
    - paragraph [ref=f6e29]: A balance tells you about today. It doesn't tell you how many years your housing is financially covered. Global Reserve answers the second question — it reads everything you hold, everything you owe on housing, and turns it into time.
    - generic [ref=f6e30]:
      - paragraph [ref=f6e31]: Years of housing covered
      - paragraph [ref=f6e32]: 8.5 years
      - paragraph [ref=f6e33]: Your own number depends on what you hold and what you owe.
  - generic [ref=f6e37]:
    - generic [ref=f6e38]:
      - paragraph [ref=f6e39]: THE PART EVERYONE ASKS ABOUT FIRST
      - heading "RED isn't money. It's housing, paid forward." [level=2] [ref=f6e40]
    - paragraph [ref=f6e68]: "RED — Real Estate Dollars — are credits that exist for one purpose: covering your housing inside Glonari. Your monthly housing fee comes out of them, and they're what stands behind you when you move on a property. They're used, not traded — which is exactly why they hold their job instead of drifting off into something else."
    - generic [ref=f6e69]:
      - paragraph [ref=f6e70]: Made for housing, and nothing else
      - paragraph [ref=f6e71]: Spent as you live, not held as an investment
      - paragraph [ref=f6e72]: The more you hold, the longer you're covered
  - generic [ref=f6e74]:
    - heading "When the system saves you money, you keep it." [level=2] [ref=f6e75]
    - paragraph [ref=f6e76]: "Glonari is always looking for a better price, a better term, a smaller fee. When it finds one, the saving doesn't disappear into the platform — it comes back to you as rewards, and those rewards work on the same thing everything else here works on: your housing."
    - paragraph [ref=f6e77]: Nothing to claim. Nothing to chase. It happens whether you're watching or not.
