    - generic [ref=f6e170]:
      - img "A modern hillside villa with an infinity pool overlooking the coast at sunset" [ref=f6e172]
      - generic [ref=f6e173]:
        - heading "A home here doesn't start with a signature. It starts with holding steady." [level=2] [ref=f6e174]: A home here doesn't start with a signature.It starts with holding steady.
        - paragraph [ref=f6e175]: "Before you take on a property, you go through a qualifying period: you set aside what's required and you keep it there. That's it. No credit theatre, no paperwork marathon — the proof is that you held your position. Global Reserve runs the clock, watches the threshold, and shows you the home you're working toward the whole way through."
    - list [ref=f6e176]:
      - listitem [ref=f6e177]:
        - generic [ref=f6e179]: Choose the home you're working toward
      - listitem [ref=f6e180]:
        - generic [ref=f6e182]: Set aside what it requires
      - listitem [ref=f6e183]:
        - generic [ref=f6e185]: Hold — and watch the days come down
      - listitem [ref=f6e186]:
        - generic [ref=f6e188]: Qualify, and move
    - paragraph [ref=f6e189]: If your position slips below what's required, the clock resets. You'll hear about it early, while it's still easy to fix.
  - generic [ref=f6e193]:
    - generic [ref=f6e196]:
      - paragraph [ref=f6e197]: "\"Your housing is covered into the mid-2030s.\""
      - paragraph [ref=f6e198]: "\"Nothing needs your attention today.\""
    - generic [ref=f6e199]:
      - paragraph [ref=f6e200]: THE PART THAT THINKS
      - heading "Gia isn't a chat window. She's the reason this feels simple." [level=2] [ref=f6e201]
      - paragraph [ref=f6e202]: Gia is the intelligence running underneath Global Reserve. She's mostly invisible, and that's the point — you should be living your life, not administering it.
      - generic [ref=f6e203]:
        - generic [ref=f6e204]:
          - paragraph [ref=f6e205]: She explains.
          - paragraph [ref=f6e206]: "Every change gets one sentence in plain language. Not a log entry, an answer: \"At your current position, your housing is covered into the mid-2030s.\""
        - generic [ref=f6e207]:
          - paragraph [ref=f6e208]: She watches.
          - paragraph [ref=f6e209]: If your qualifying position starts drifting toward trouble, you hear it while it's still small.
        - generic [ref=f6e210]:
          - paragraph [ref=f6e211]: She handles.
          - paragraph [ref=f6e212]: Your monthly housing fee is taken care of in the background. No transfers, no reminders, no late anything.
        - generic [ref=f6e213]:
          - paragraph [ref=f6e214]: She looks ahead.
          - paragraph [ref=f6e215]: She keeps an eye on what your housing will need later and quietly keeps your position moving in that direction.
        - generic [ref=f6e216]:
          - paragraph [ref=f6e217]: She marks the moments.
          - paragraph [ref=f6e218]: First foundation. First qualification. First home secured. Years of work shouldn't end up as a line in a transaction list.
      - paragraph [ref=f6e219]: Gia never moves anything without your permission. She just makes sure you never have to guess.
