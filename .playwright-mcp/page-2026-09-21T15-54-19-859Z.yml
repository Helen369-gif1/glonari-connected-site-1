      - img "A modern hillside villa with an infinity pool overlooking the coast at sunset" [ref=f4e172]
      - generic [ref=f4e173]:
        - heading "A home here doesn't start with a signature. It starts with holding steady." [level=2] [ref=f4e174]: A home here doesn't start with a signature.It starts with holding steady.
        - paragraph [ref=f4e175]: "Before you take on a property, you go through a qualifying period: you set aside what's required and you keep it there. That's it. No credit theatre, no paperwork marathon — the proof is that you held your position. Global Reserve runs the clock, watches the threshold, and shows you the home you're working toward the whole way through."
    - list [ref=f4e176]:
      - listitem [ref=f4e177]:
        - generic [ref=f4e179]: Choose the home you're working toward
      - listitem [ref=f4e180]:
        - generic [ref=f4e182]: Set aside what it requires
      - listitem [ref=f4e183]:
        - generic [ref=f4e185]: Hold — and watch the days come down
      - listitem [ref=f4e186]:
        - generic [ref=f4e188]: Qualify, and move
    - paragraph [ref=f4e189]: If your position slips below what's required, the clock resets. You'll hear about it early, while it's still easy to fix.
