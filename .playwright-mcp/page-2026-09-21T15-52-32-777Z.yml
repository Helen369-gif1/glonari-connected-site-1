      - generic [ref=f1e173]:
        - heading "A home here doesn't start with a signature. It starts with holding steady." [level=2] [ref=f1e174]: A home here doesn't start with a signature.It starts with holding steady.
        - paragraph [ref=f1e175]: "Before you take on a property, you go through a qualifying period: you set aside what's required and you keep it there. That's it. No credit theatre, no paperwork marathon — the proof is that you held your position. Global Reserve runs the clock, watches the threshold, and shows you the home you're working toward the whole way through."
    - list [ref=f1e176]:
      - listitem [ref=f1e177]:
        - generic [ref=f1e179]: Choose the home you're working toward
      - listitem [ref=f1e180]:
