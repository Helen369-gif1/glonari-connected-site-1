    - generic [ref=f4e199]:
      - paragraph [ref=f4e200]: THE PART THAT THINKS
      - heading "Gia isn't a chat window. She's the reason this feels simple." [level=2] [ref=f4e201]
      - paragraph [ref=f4e202]: Gia is the intelligence running underneath Global Reserve. She's mostly invisible, and that's the point — you should be living your life, not administering it.
      - generic [ref=f4e203]:
        - generic [ref=f4e204]:
          - paragraph [ref=f4e205]: She explains.
          - paragraph [ref=f4e206]: "Every change gets one sentence in plain language. Not a log entry, an answer: \"At your current position, your housing is covered into the mid-2030s.\""
        - generic [ref=f4e207]:
          - paragraph [ref=f4e208]: She watches.
          - paragraph [ref=f4e209]: If your qualifying position starts drifting toward trouble, you hear it while it's still small.
        - generic [ref=f4e210]:
          - paragraph [ref=f4e211]: She handles.
          - paragraph [ref=f4e212]: Your monthly housing fee is taken care of in the background. No transfers, no reminders, no late anything.
        - generic [ref=f4e213]:
          - paragraph [ref=f4e214]: She looks ahead.
          - paragraph [ref=f4e215]: She keeps an eye on what your housing will need later and quietly keeps your position moving in that direction.
        - generic [ref=f4e216]:
          - paragraph [ref=f4e217]: She marks the moments.
          - paragraph [ref=f4e218]: First foundation. First qualification. First home secured. Years of work shouldn't end up as a line in a transaction list.
      - paragraph [ref=f4e219]: Gia never moves anything without your permission. She just makes sure you never have to guess.
