      - listitem [ref=f1e183]:
        - generic [ref=f1e185]: Hold — and watch the days come down
      - listitem [ref=f1e186]:
        - generic [ref=f1e188]: Qualify, and move
    - paragraph [ref=f1e189]: If your position slips below what's required, the clock resets. You'll hear about it early, while it's still easy to fix.
